[workspace]

[package]
name = "spike-23"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rig-core = { version = "0.43", default-features = false, features = ["rustls", "reqwest"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
